name: Continuous Autonomous Advancement Engine

on:
  schedule:
    - cron: '*/5 * * * *' # Executes 24/7 every 5 minutes in GitHub Actions Cloud
  push:
    branches: [main]     # Instantly trigger next cycle whenever a PR is merged into main
  issues:
    types: [opened]       # Instant event-driven trigger whenever an issue is created
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of autonomous development cycles to run'
        required: false
        default: '2'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  advance:
    name: Autonomous Engine (Worker ${{ matrix.worker }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        worker: [1, 2, 3, 4, 5]
      fail-fast: false
    concurrency:
      group: continuous-advancement-worker-${{ matrix.worker }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv & Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Dependencies
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          uv pip install -e ".[api,dev]"

      - name: Configure Git User Identity
        run: |
          git config user.name "Aditya Dahale"
          git config user.email "aditya-9-6@users.noreply.github.com"

      - name: Execute Continuous Multi-Cycle Development Batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GEMINI_KEY_POOL: ${{ secrets.GEMINI_KEY_POOL || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GEMINI_ISSUE_KEY: ${{ secrets.GEMINI_ISSUE_KEY || '' }}
          GEMINI_REVIEWER_KEY: ${{ secrets.GEMINI_REVIEWER_KEY || '' }}
          GEMINI_SOLVER_KEY: ${{ secrets.GEMINI_SOLVER_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || '' }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY || '' }}
        run: |
          ITER="${{ github.event.inputs.iterations || '3' }}"
          python3 scripts/autonomous_loop.py --workspace . --worker-id ${{ matrix.worker }} --interval 5 --iterations "$ITER"

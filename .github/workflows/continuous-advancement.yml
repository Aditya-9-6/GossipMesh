name: Continuous Autonomous Advancement Engine

on:
  schedule:
    - cron: '*/5 * * * *' # Executes 24/7 every 5 minutes in GitHub Actions Cloud
  issues:
    types: [opened]       # Instant event-driven trigger whenever an issue is created
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of autonomous development cycles to run'
        required: false
        default: '5'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  advance:
    name: Autonomous Engine (Worker ${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [1, 2, 3]
      fail-fast: false
    concurrency:
      group: continuous-advancement-worker-${{ matrix.worker }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -e .[api,dev]

      - name: Configure Git User Identity
        run: |
          git config user.name "Aditya Dahale"
          git config user.email "aditya-9-6@users.noreply.github.com"

      - name: Execute Continuous Multi-Cycle Development Batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GEMINI_KEY_POOL: ${{ secrets.GEMINI_KEY_POOL || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GEMINI_ISSUE_KEY: ${{ secrets.GEMINI_ISSUE_KEY || '' }}
          GEMINI_REVIEWER_KEY: ${{ secrets.GEMINI_REVIEWER_KEY || '' }}
          GEMINI_SOLVER_KEY: ${{ secrets.GEMINI_SOLVER_KEY || '' }}
        run: |
          python3 scripts/autonomous_loop.py --workspace . --interval 5 --once

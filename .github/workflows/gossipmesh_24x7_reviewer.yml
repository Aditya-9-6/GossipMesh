name: GossipMesh 24/7 Dual-Pool Engine (PRs & Issues)

on:
  schedule:
    # 24/7 continuous autonomous processing every 5 minutes (Guaranteed Fallback)
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: false
        default: 'parallel'
        type: choice
        options:
          - parallel
          - fallback-all
          - pr-only
          - issue-only

concurrency:
  group: gossipmesh-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  actions: write

jobs:
  pr-worker:
    name: ⚡ PR Reviewer & Auto-Merger Lane
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout GossipMesh
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Go (for Go targets)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
        continue-on-error: true

      - name: Install Reviewer Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[api,dev]" || pip install -e . || true; fi

      - name: Configure Git Committer Identity
        run: |
          git config --global user.name "Dahale Aditya Dnyaneshwar"
          git config --global user.email "adityadahale96@gmail.com"

      - name: Verify GitHub CLI Authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status

      - name: Run Dedicated PR Reviewer & Auto-Merger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_AUTHOR_NAME: "Dahale Aditya Dnyaneshwar"
          GIT_AUTHOR_EMAIL: "adityadahale96@gmail.com"
          GIT_COMMITTER_NAME: "Dahale Aditya Dnyaneshwar"
          GIT_COMMITTER_EMAIL: "adityadahale96@gmail.com"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_REVIEWER_KEY: ${{ secrets.GEMINI_REVIEWER_KEY }}
          GEMINI_SOLVER_KEY: ${{ secrets.GEMINI_SOLVER_KEY }}
          GEMINI_ISSUE_KEY: ${{ secrets.GEMINI_ISSUE_KEY }}
          GEMINI_KEY_POOL: ${{ secrets.GEMINI_KEY_POOL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "[*] Triggered on PR #$PR_NUM. Running AI Architectural & Security Review..."
            python scripts/ai_pr_reviewer.py --pr-number "$PR_NUM" --workspace .
          elif [ "${{ github.event_name }}" = "issue_comment" ] && [ -n "${{ github.event.issue.pull_request }}" ]; then
            PR_NUM="${{ github.event.issue.number }}"
            echo "[*] Triggered by comment on PR #$PR_NUM. Re-evaluating review..."
            python scripts/ai_pr_reviewer.py --pr-number "$PR_NUM" --workspace .
          elif [ "${{ github.event.inputs.mode }}" = "fallback-all" ]; then
            echo "[*] Running Fallback Dual-Pool Mode (All)..."
            python scripts/batch_dual_engine.py --repo "${{ github.repository }}" --workspace . --mode all
          else
            echo "[*] Running Dedicated PR Reviewer Lane (Max 8 PRs)..."
            python scripts/batch_dual_engine.py --repo "${{ github.repository }}" --workspace . --mode pr-only --max-prs 8
          fi

  issue-worker:
    name: 🚀 Issue Solver Lane (Shard ${{ matrix.shard }})
    if: github.event_name != 'pull_request' && (github.event_name != 'issue_comment' || !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - name: Checkout GossipMesh
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Go (for Go targets)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
        continue-on-error: true

      - name: Install Solver Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[api,dev]" || pip install -e . || true; fi

      - name: Configure Git Committer Identity
        run: |
          git config --global user.name "Dahale Aditya Dnyaneshwar"
          git config --global user.email "adityadahale96@gmail.com"

      - name: Verify GitHub CLI Authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status

      - name: Run Dedicated Issue Solver & Auto-PR Synthesis (Shard ${{ matrix.shard }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_AUTHOR_NAME: "Dahale Aditya Dnyaneshwar"
          GIT_AUTHOR_EMAIL: "adityadahale96@gmail.com"
          GIT_COMMITTER_NAME: "Dahale Aditya Dnyaneshwar"
          GIT_COMMITTER_EMAIL: "adityadahale96@gmail.com"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_REVIEWER_KEY: ${{ secrets.GEMINI_REVIEWER_KEY }}
          GEMINI_SOLVER_KEY: ${{ secrets.GEMINI_SOLVER_KEY }}
          GEMINI_ISSUE_KEY: ${{ secrets.GEMINI_ISSUE_KEY }}
          GEMINI_KEY_POOL: ${{ secrets.GEMINI_KEY_POOL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            ISSUE_NUM="${{ github.event.issue.number }}"
            if [ "$(( ISSUE_NUM % 2 ))" -eq "${{ matrix.shard }}" ]; then
              ISSUE_TITLE="${{ github.event.issue.title }}"
              echo "[*] Triggered on Issue #$ISSUE_NUM (Matches Shard ${{ matrix.shard }}). Resolving..."
              BODY=$(gh issue view "$ISSUE_NUM" --json body -q .body)
              python scripts/ai_issue_solver.py --issue-number "$ISSUE_NUM" --issue-title "$ISSUE_TITLE" --issue-body "$BODY" --workspace .
            else
              echo "[*] Issue #$ISSUE_NUM belongs to other shard. Skipping."
            fi
          elif [ "${{ github.event.inputs.mode }}" = "fallback-all" ]; then
            if [ "${{ matrix.shard }}" -eq 0 ]; then
              echo "[*] Fallback mode active: handled by primary runner."
              python scripts/batch_dual_engine.py --repo "${{ github.repository }}" --workspace . --mode all
            fi
          else
            echo "[*] Running Dedicated Issue Solver Lane Shard ${{ matrix.shard }}/2 (Max 12 Issues per run)..."
            python scripts/batch_dual_engine.py --repo "${{ github.repository }}" --workspace . --mode issue-only --shard-id ${{ matrix.shard }} --num-shards 2 --max-issues 12
          fi

      - name: Turbo Autonomous Re-dispatch Loop (Bypass Cron Delays)
        if: always() && matrix.shard == 0 && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_ISSUES=$(gh issue list --state open --limit 1 --json number --jq '.[].number' 2>/dev/null || true)
          OPEN_PRS=$(gh pr list --state open --limit 1 --json number --jq '.[].number' 2>/dev/null || true)
          if [ -n "$OPEN_ISSUES" ] || [ -n "$OPEN_PRS" ]; then
            echo "[⚡ TURBO RE-DISPATCH] Active items remain in backlog (Issues: $OPEN_ISSUES, PRs: $OPEN_PRS)."
            echo "Re-dispatching next engine cycle immediately to bypass GitHub Actions cron queue lag..."
            sleep 10
            gh workflow run gossipmesh_24x7_reviewer.yml --ref main || true
          else
            echo "[✓] Backlog clear. Falling back to 5-minute cron schedule."
          fi

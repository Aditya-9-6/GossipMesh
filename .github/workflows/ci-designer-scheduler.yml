name: CI Designer Scheduler

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  schedule-design:
    name: Scheduled CI Design for Open PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run CI Designer for each open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_LIST=$(gh pr list --state open --json number -q '.[].number')
          if [ -z "$PR_LIST" ]; then
            echo "No open PRs found."
            exit 0
          fi
          for PR in $PR_LIST; do
            echo "--- Processing PR #$PR ---"
            PR_NUMBER=$PR python scripts/gossipmesh_ci_designer.py || true
            gh pr edit "$PR" --add-label "ci-designed" || true
          done

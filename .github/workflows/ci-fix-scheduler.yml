# Scheduled CI fixer trigger – runs 24/7 on GitHub Actions
# This workflow runs every 5 minutes, lists all open PRs, and triggers the AI CI Test Fixer bot.

name: CI Fixer Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  trigger-ci-fixer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trigger AI CI Fixer for all open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing open PRs..."
          PR_NUMBERS=$(gh pr list --state open --json number --jq '.[].number')
          echo "Found PRs: $PR_NUMBERS"
          for PR in $PR_NUMBERS; do
            echo "Triggering AI CI Fixer for PR #$PR"
            gh workflow run "AI CI Test Fixer Bot" -f pr_number="$PR" || true
          done

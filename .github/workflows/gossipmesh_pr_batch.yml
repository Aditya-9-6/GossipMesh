name: GossipMesh PR Batch Processor

# Run every 10 minutes (24/7) and allow manual trigger
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: gossipmesh-pr-batch
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (uv fallback)
        run: |
          python -m pip install --upgrade pip
          pip install uv
          if [ -f requirements.txt ]; then
            uv pip install -r requirements.txt || pip install -r requirements.txt
          fi

      - name: Verify GitHub CLI Authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status

      - name: Export API keys for the agent
        env:
          GITHUB_KEYS: ${{ secrets.GITHUB_KEYS }}
        run: |
          mkdir -p .gossip_mesh
          echo "$GITHUB_KEYS" > .gossip_mesh/.gemini_keys
          chmod 600 .gossip_mesh/.gemini_keys

      - name: Run optimized multi-provider batch PR processor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_REVIEWER_KEY: ${{ secrets.GEMINI_REVIEWER_KEY }}
          GEMINI_SOLVER_KEY: ${{ secrets.GEMINI_SOLVER_KEY }}
          GEMINI_KEY_POOL: ${{ secrets.GEMINI_KEY_POOL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python scripts/batch_process_prs_optimized.py

name: GossipMesh PR Batch Processor

# Run every 10 minutes (adjust as needed) and allow manual trigger
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: gossipmesh-pr-batch
  cancel-in-progress: true

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # safety timeout; each run should finish well within this
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (uv fallback)
        run: |
          python -m pip install --upgrade pip
          pip install uv
          # Try installing via uv first (fast), fall back to pip if uv lock is missing
          if [ -f requirements.txt ]; then
            uv pip install -r requirements.txt || pip install -r requirements.txt
          fi

      - name: Install GitHub CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | gh auth login --with-token
          gh auth status

      - name: Export API keys for the agent
        env:
          GITHUB_KEYS: ${{ secrets.GITHUB_KEYS }}
        run: |
          mkdir -p .gossip_mesh
          echo "$GITHUB_KEYS" > .gossip_mesh/.gemini_keys
          # Ensure the file has proper permissions for the scripts to read
          chmod 600 .gossip_mesh/.gemini_keys

      - name: Run optimized batch PR processor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/batch_process_prs_optimized.py

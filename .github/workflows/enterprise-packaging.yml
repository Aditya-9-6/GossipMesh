name: Enterprise Air-Gapped Packaging & Verification

on:
  push:
    branches: [main]
    paths:
      - 'enterprise/**'
      - 'models/**'
      - 'scripts/infrastructure_reviewer.py'
      - 'scripts/issue_license.py'
      - 'Dockerfile'
      - '.github/workflows/enterprise-packaging.yml'
  pull_request:
    branches: [main]
    paths:
      - 'enterprise/**'
      - 'models/**'
      - 'scripts/infrastructure_reviewer.py'
      - 'scripts/issue_license.py'
      - 'Dockerfile'
      - '.github/workflows/enterprise-packaging.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-enterprise:
    name: Enterprise Test Suite & Cryptographic Verification
    runs-on: ubuntu-latest
    steps:
      - name: Set lower case owner name
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r enterprise/requirements.txt pytest httpx

      - name: Run Enterprise Tests
        run: |
          pytest tests/enterprise/ -v

  build-bundles:
    name: Build & Verify Docker Bundle (${{ matrix.bundle }})
    needs: test-enterprise
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: [b01, b02, b03, b04, b05]
    steps:
      - name: Set lower case owner name
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Air-Gapped Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUNDLE_ID=${{ matrix.bundle }}
          tags: ghcr.io/${{ env.REPO_OWNER }}/gossipmesh-reviewer:${{ matrix.bundle }}
          load: true

      - name: Verify Container Execution
        run: |
          docker run --rm ghcr.io/${{ env.REPO_OWNER }}/gossipmesh-reviewer:${{ matrix.bundle }} --help

      - name: Log into GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ env.REPO_OWNER }}/gossipmesh-reviewer:${{ matrix.bundle }}

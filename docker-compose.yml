services:
  redis:
    image: redis:7-alpine
    container_name: gossipmesh_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  agent_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: gossipmesh_agent_worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
    profiles:
      - full

volumes:
  redis_data:

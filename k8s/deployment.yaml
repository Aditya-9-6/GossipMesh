apiVersion: v1
kind: Namespace
metadata:
  name: gossipmesh
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-external
  namespace: gossipmesh
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gossipmesh-api
  namespace: gossipmesh
  labels:
    app: gossipmesh-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gossipmesh-api
  template:
    metadata:
      labels:
        app: gossipmesh-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/aditya-9-6/gossipmesh-api:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gossipmesh-api-hpa
  namespace: gossipmesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gossipmesh-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gossipmesh-db-migrate
  namespace: gossipmesh
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/aditya-9-6/gossipmesh-api:latest
          command: ["alembic", "upgrade", "head"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gossipmesh-ingress
  namespace: gossipmesh
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.gossipmesh.com
      secretName: gossipmesh-tls-cert
  rules:
    - host: app.gossipmesh.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gossipmesh-frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gossipmesh-api
                port:
                  number: 8000

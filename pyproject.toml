[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gossipmesh"
version = "0.1.0"
description = "Decentralized P2P Gossip Protocol Multi-Agent Autonomous Engineering Mesh"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Aditya Dahale", email = "aditya-9-6@users.noreply.github.com"}
]
keywords = [
    "multi-agent",
    "gossip-protocol",
    "autonomous-agents",
    "byzantine-consensus",
    "ai-software-engineering",
    "peer-to-peer"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "pydantic>=2.6.4",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.2.1",
    "passlib>=1.7.4",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.5",
    "python-multipart>=0.0.9",
    "openai>=1.14.0",
    "tiktoken>=0.6.0",
    "anthropic>=0.21.3",
    "google-generativeai>=0.4.1",
    "httpx>=0.27.0",
    "PyGithub>=2.2.0",
    "pgvector>=0.2.5",
    "networkx>=3.2.1",
    "boto3>=1.34.0",
    "google-cloud-aiplatform>=1.40.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-rust>=0.21.2",
    "tree-sitter-cpp>=0.21.2",
    "gitpython>=3.1.43"
]

[project.scripts]
gossipmesh = "gossipmesh.cli:main"

[tool.setuptools.packages.find]
include = ["gossipmesh*"]

[project.optional-dependencies]
api = ["fastapi", "httpx"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "coverage", "ruff>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --durations=5"
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: mark a test as an asyncio test",
]

[tool.coverage.run]
source = ["gossipmesh"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
disable_error_code = ["arg-type", "union-attr", "override", "call-arg", "assignment", "import-untyped", "annotation-unchecked"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gossipmesh"
version = "0.1.0"
description = "Decentralized P2P Gossip Protocol Multi-Agent Autonomous Engineering Mesh"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Aditya Dahale", email = "aditya-9-6@users.noreply.github.com"}
]
keywords = [
    "multi-agent",
    "gossip-protocol",
    "autonomous-agents",
    "byzantine-consensus",
    "ai-software-engineering",
    "peer-to-peer"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "passlib>=1.7.4",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.5",
    "python-multipart>=0.0.9",
    "openai>=1.14.0",
    "tiktoken>=0.6.0",
    "anthropic>=0.21.3",
    "google-generativeai>=0.4.1",
    "httpx>=0.27.0",
    "PyGithub>=2.2.0",
    "pgvector>=0.2.5",
    "networkx>=3.2.1"
]

[project.scripts]
gossipmesh = "gossipmesh.cli:main"

[tool.setuptools.packages.find]
include = ["gossipmesh*"]
